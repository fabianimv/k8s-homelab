# Pod con múltiples containers
# Los containers en un pod comparten:
# - Red (localhost)
# - Volúmenes
# - Namespace de procesos
apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  labels:
    app: multi-container
spec:
  containers:
  # Container principal: nginx
  - name: nginx
    image: nginx:1.30-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
  
  # Sidecar: espera a que nginx cree access.log y luego lo sigue
  - name: sidecar
    image: busybox:1.37
    command:
    - sh
    - -c
    - until [ -f /var/log/nginx/access.log ]; do sleep 1; done; exec tail -f /var/log/nginx/access.log
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
  
  # Volumen compartido entre containers
  volumes:
  - name: shared-logs
    emptyDir: {}
