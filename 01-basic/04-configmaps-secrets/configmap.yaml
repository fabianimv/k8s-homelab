# ConfigMap - Para configuraciones no sensibles
# Separa variables de entorno de archivos completos para evitar
# que envFrom intente crear variables con nombres inválidos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-env
data:
  # Valores simples (válidos como nombres de variables de entorno)
  APP_ENV: "production"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"

---
# ConfigMap con el archivo de configuración completo
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    server {
      listen 80;
      server_name localhost;
      
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      
      location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
      }
    }
