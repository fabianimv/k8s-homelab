# Pod que usa ConfigMap y Secret
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-config
spec:
  containers:
  - name: app
    image: nginx:1.30-alpine
    
    # Variables de entorno desde ConfigMap (solo claves válidas)
    envFrom:
    - configMapRef:
        name: nginx-env
    
    # Variables de entorno desde Secret
    env:
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password
    
    # Montar ConfigMap como archivo
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
      readOnly: true
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
  
  volumes:
  - name: config-volume
    configMap:
      name: nginx-config
  - name: secret-volume
    secret:
      secretName: db-credentials
